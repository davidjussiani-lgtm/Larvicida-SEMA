<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Larvicida — Mapa (base GitHub)</title>
  <link crossorigin="anonymous" media="all" rel="stylesheet" href="https://github.githubassets.com/assets/primer-primitives-9f1db623a2d85734.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="site-header">
    <svg width="28" height="28" viewBox="0 0 16 16" fill="white" aria-hidden="true"><path d="M8 .198a8 8 0 0 0-2.53 15.59c.4.074.547-.174.547-.387 0-.192-.007-.7-.01-1.374-2.226.483-2.695-1.073-2.695-1.073-.364-.925-.89-1.172-.89-1.172-.727-.497.055-.487.055-.487.803.056 1.225.825 1.225.825.714 1.224 1.873.871 2.33.667.072-.517.279-.871.507-1.072-1.777-.202-3.644-.889-3.644-3.955 0-.873.312-1.587.824-2.148-.083-.203-.357-1.017.078-2.12 0 0 .672-.215 2.2.82a7.6 7.6 0 0 1 2-.268c.68.003 1.366.092 2 .268 1.527-1.035 2.198-.82 2.198-.82.437 1.103.163 1.917.08 2.12.513.561.823 1.275.823 2.148 0 3.073-1.87 3.75-3.65 3.948.287.246.542.733.542 1.479 0 1.067-.01 1.93-.01 2.192 0 .214.145.464.55.386A8 8 0 0 0 8 .198z"></path></svg>
    <div>
      <div style="font-weight:700">Larvicida-SEMA</div>
      <div style="font-size:0.9rem;opacity:0.95">Mapa público integrado — versão com base GitHub</div>
    </div>
  </header>

  <main style="display:flex;gap:12px;padding:16px;">
    <aside style="width:320px">
      <div class="card">
        <h2>Resumo</h2>
        <div id="summary"></div>
      </div>
      <div class="card">
        <h3>Enviar KMZ / KML</h3>
        <p class="muted">Envie um arquivo para atualizar o mapa automaticamente (requer implantação do endpoint serverless).</p>
        <input id="uploadFile" type="file" accept=".kmz,.kml" />
        <div>
          <button id="uploadBtn" class="button">Enviar</button>
        </div>
        <div id="uploadStatus" class="muted" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <h3>Camadas</h3>
        <ul id="layers"></ul>
      </div>
    </aside>

    <section id="map-wrap" style="flex:1">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
