<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Larvicida - Mapa</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-sA+q0XgM0VjvY1qvGkGkZ2eQv3w0XKpGk5f5R9gGIK0=" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/logo.svg" alt="Larvicida" class="logo">
      <div>
        <h1>Larvicida Atualizado</h1>
        <p class="subtitle">Mapeamento público e dados de aplicação</p>
      </div>
    </div>
  </header>

  <main>
    <aside id="sidebar">
      <div class="sidebar-header">
        <div>
          <h2>Resumo do mapa</h2>
          <div id="summary"></div>
        </div>
      </div>
      <div class="card">
        <h3>Legenda</h3>
        <div class="legend">
          <div class="item"><img src="assets/marker-point.svg" alt="ponto"> Pontos</div>
          <div class="item"><img src="assets/marker-line.svg" alt="linha"> Linhas</div>
          <div class="item"><img src="assets/marker-polygon.svg" alt="polígono"> Polígonos</div>
        </div>
      </div>
      <div class="card">
        <h3>Camadas</h3>
        <ul id="layers"></ul>
        <div style="margin-top:.5rem;display:flex;gap:.5rem;flex-wrap:wrap">
          <a id="kmlLink" class="button" target="_blank">Baixar KML</a>
          <button id="showGoogle" class="button" style="background:var(--brand-2)">Mostrar no Google</button>
          <button id="showLocal" class="button" style="background:#444">Mostrar no Site</button>
        </div>
      </div>
    </aside>

    <section id="map-wrap">
      <div id="map"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-o9N1j7kqGk5l8w0kDk+7R6v4b8H1s9t1Z4v1j2Yf1cA=" crossorigin=""></script>
  <script src="js/app.js"></script>
</body>
</html>
